<!doctype html>
<html lang="es-PR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="EcoStore" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1E7F35" />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/hero/house-1200.webp"
      imagesrcset="/images/hero/house-800.webp 800w, /images/hero/house-1200.webp 1200w, /images/hero/house-1600.webp 1536w"
      imagesizes="(max-width: 760px) 108vw, min(1180px, 94vw)"
      fetchpriority="high"
    />
    <title>EcoStore · Eficiencia energética y conservación de agua en Puerto Rico</title>
    <meta
      name="description"
      content="Tienda y servicios de eficiencia energética y agua en San Juan. Solar, calentadores, conservación de agua y auditoría para hogares y negocios en Puerto Rico."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.ecostorepr.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_PR" />
    <meta property="og:site_name" content="EcoStore" />
    <style>
      @font-face{font-family:Inter;font-style:normal;font-weight:400 700;font-display:swap;src:url('/fonts/inter.woff2') format('woff2')}
      @font-face{font-family:Outfit;font-style:normal;font-weight:500 800;font-display:swap;src:url('/fonts/outfit.woff2') format('woff2')}
      html,body{margin:0;background:#fff;color:#0F2216;font-family:Inter,system-ui,sans-serif}
      #root{min-height:100dvh}
      .lcp-house{position:fixed;left:50%;bottom:0;width:min(1180px,94vw);height:auto;aspect-ratio:1536/1024;transform:translateX(-50%);object-fit:contain;pointer-events:none;z-index:1}
      @media (max-width:760px){.lcp-house{width:108vw}}
      html.is-app .lcp-house{display:none}
    </style>
    <link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/outfit.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <script>
      if (location.pathname !== '/' && location.pathname !== '/index.html') document.documentElement.classList.add('is-app')
    </script>
    <img
      class="lcp-house"
      src="/images/hero/house-800.webp"
      srcset="/images/hero/house-800.webp 800w, /images/hero/house-1200.webp 1200w, /images/hero/house-1600.webp 1536w"
      sizes="(max-width: 760px) 108vw, min(1180px, 94vw)"
      alt="Casa equipada con productos EcoStore"
      width="1536"
      height="1024"
      fetchpriority="high"
      decoding="async"
    />
    <noscript>
      <p>EcoStore — eficiencia energética y conservación de agua en Puerto Rico.</p>
      <p>1354 Avenida F.D. Roosevelt, San Juan, 00920. Tel. (787) 664-7676. info@ecostorepr.com</p>
      <ul>
        <li><a href="/energia-solar">Energía solar</a></li>
        <li><a href="/calentadores-solares">Calentadores solares</a></li>
        <li><a href="/conservacion-de-agua">Conservación de agua</a></li>
        <li><a href="/auditoria-energetica">Auditoría energética</a></li>
        <li><a href="/contacto">Contacto</a></li>
      </ul>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
